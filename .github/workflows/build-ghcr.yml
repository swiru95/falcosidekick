name: Build and push GHCR image

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: falcosidekick

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: Build binary for linux/amd64
        run: |
          mkdir -p linux/amd64
          GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags "-X main.GitVersion=$(git describe --tags --always --dirty) \
              -X main.gitCommit=$(git rev-parse HEAD) \
              -X main.gitTreeState=$(git diff --quiet >/dev/null 2>&1 && echo clean || echo dirty) \
              -X main.buildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -gcflags all=-trimpath=/src \
            -asmflags all=-trimpath=/src \
            -a \
            -installsuffix cgo \
            -o linux/amd64/falcosidekick \
            .

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          COMMIT_SHA=${{ github.sha }}
          echo "tags=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${COMMIT_SHA},${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
          echo "labels=org.opencontainers.image.revision=${COMMIT_SHA}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=falcosidekick
          cache-to: type=gha,mode=max,scope=falcosidekick

      - name: Summary
        run: |
          echo "### falcosidekick" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
